name: Deploy Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout avec submodules
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 2. Setup Pages (configuration spéciale GitHub Pages)
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 3. Génération du fichier secrets.json
      - name: Generate secrets.json with Maps & KV keys
        run: |
          jq -n --arg maps "$MAPS_API_KEY" --arg kv "$KV_API_KEY" \
            '{MAPS_API_KEY:$maps, KV_API_KEY:$kv}' > secrets.json
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          KV_API_KEY: ${{ secrets.KV_API_KEY }}

      - name: Créer bt1oh97j7X.bin (base64 + rot13)
        shell: bash
        run: |
          mkdir -p dist
          cat > /tmp/bt1oh97j7X.json <<'JSON'
          {
            "KV_API_KEY": "${{ secrets.KV_API_KEY }}",
            "MAPS_API_KEY": "${{ secrets.MAPS_API_KEY }}"
          }
          JSON
          B64="$(base64 -w 0 /tmp/bt1oh97j7X.json)"
          ROT="$(printf '%s' "$B64" | tr 'A-Za-z' 'N-ZA-Mn-za-m')"
          printf '%s' "$ROT" | gzip -9 -c > dist/bt1oh97j7X.bin


      # 4. Build avec l’action officielle Jekyll
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: ./_site
        env:
          JEKYLL_ENV: production

      # 5. Upload de l'artifact (_site)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
